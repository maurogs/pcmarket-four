          a: "Einstellen ist kostenlos und ohne Monatsgebühr. Beim Start fällt keine Provision an; danach nur bei einem abgeschlossenen Verkauf."
        - q: "Wer legt den Preis fest?"
          a: "Du. Du kannst ihn jederzeit ändern und Angebote unter dem Listenpreis annehmen."
        - q: "Woher weiß ich, dass der Käufer zahlt?"
          a: "Die Zahlung läuft über PCMarket und bleibt gesperrt, bis du versendest und der Käufer den Erhalt bestätigt."
        - q: "Wann erhalte ich das Geld?"
          a: "Der Käuferschutz gibt die Zahlung nach der Prüfung frei. Bei Problemen vermittelt der Support vor der Auszahlung."
        - q: "Muss ich versenden oder geht Übergabe?"
          a: "Wähle versicherten Versand oder lokale Abholung. Bei beidem entscheidet der Käufer an der Kasse."
        - q: "Was, wenn mein Angebot abgelehnt wird?"
          a: "Wir erklären warum; du kannst es korrigieren und erneut einreichen. Nichts geht ohne Prüfung live."
    final:
