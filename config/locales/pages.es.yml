      title: "Vendidos recientemente"
      body: "Equipos que han encontrado nuevo dueño esta semana."
    faq:
      title: "Preguntas frecuentes"
      body: "Lo que más nos preguntan antes de publicar el primer anuncio."
      contact: "Ver el centro de ayuda"
      items:
        - q: "¿Cuánto cuesta publicar?"
          a: "Publicar es gratis y no hay cuotas mensuales. Durante el lanzamiento no cobramos comisión; cuando se active, solo se aplica al completar una venta."
        - q: "¿Quién fija el precio?"
          a: "Tú. Puedes ajustarlo cuando quieras y aceptar ofertas por debajo del precio publicado."
        - q: "¿Cómo sé que el comprador pagará?"
          a: "El pago se realiza dentro de PCMarket y queda retenido hasta que confirmas el envío y el comprador confirma la recepción."
        - q: "¿Cuándo recibo el dinero?"
          a: "La protección al comprador libera el pago después de la inspección. Si hay una incidencia, el equipo de soporte media antes de liberar el importe."
        - q: "¿Tengo que enviar o puedo entregar en mano?"
          a: "Elige envío con seguimiento o recogida local. Si ofreces ambas, el comprador decide en el checkout."
        - q: "¿Qué pasa si mi anuncio se rechaza?"
          a: "Te explicamos el motivo y puedes corregirlo y volver a enviarlo. Nunca se publica nada sin revisión."
    final:
      title: "¿Listo para vender?"
      body: "Publica hoy y llega a compradores que ya están buscando tu modelo."
      cta: "Publicar mi equipo"
      sell_to_us: "Véndenos tu equipo"

