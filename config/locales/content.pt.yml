pt:
  content:
    legal_page:
      breadcrumb: "Informações legais"
      sidebar_title: "Documentos legais · %{country}"
      market_note: "Está a ver os documentos legais do mercado %{country}."
      last_updated: "Última atualização: %{date}"
      version: "Versão %{version}"
      print: "Imprimir"
      toc_title: "Nesta página"
      cookie_cta_body: "Pode aceitar, recusar ou alterar os cookies analíticos e de marketing a qualquer momento."
    trust:
      meta_description: "Vendedores verificados, revisão manual dos anúncios, pagamentos protegidos e uma equipa real. É assim que a PCMarket protege cada compra."
      eyebrow: "Confiança e segurança"
      title: "Confiança e segurança"
      hero_title: "A PCMarket é segura? É assim que protegemos cada compra"
      hero_body: "Revemos os anúncios antes da publicação, retemos o pagamento até à entrega e temos pessoas reais do outro lado. Sem promessas vazias: estas são as regras."
      hero_primary_cta: "Explorar anúncios"
      hero_secondary_cta: "Visitar o centro de ajuda"
      stats:
        title: "A PCMarket em números"
        note: "Mostramos números reais da plataforma. Se um valor ainda for pequeno, dizemo-lo em vez de o inventar."
        completed_orders:
          label: "Encomendas concluídas"
          hint: "Compras entregues e encerradas com sucesso."
          fallback: "A crescer todas as semanas"
        verified_stores:
          label: "Lojas verificadas"
          hint: "Vendedores com identidade e dados confirmados."
          fallback: "Verificação em curso"
        average_rating:
          label: "Avaliação média"
          hint: "Média das lojas com avaliações publicadas."
          fallback: "Avaliações a caminho"
        reviewed_listings:
          label: "Anúncios revistos"
          hint: "Anúncios verificados manualmente pela equipa."
          fallback: "Revisão diária em curso"
      how:
        title: "Como funciona a proteção do comprador"
        body: "Paga à PCMarket, não diretamente ao vendedor. O dinheiro é libertado quando confirma a receção ou termina o prazo de inspeção de %{days} dias."
        step1_title: "Pague em segurança na PCMarket"
        step1_body: "O valor fica retido na plataforma. Nunca enviamos o seu dinheiro ao vendedor no momento da compra."
        step2_title: "O vendedor envia com seguimento"
        step2_body: "Recebe um número de seguimento e pode acompanhar o envio na encomenda."
        step3_title: "Inspeciona antes do pagamento"
        step3_body: "Tem %{days} dias para testar o produto, confirmar a receção ou abrir uma disputa."
      covered:
        eyebrow: "Coberto"
        title: "O que a proteção do comprador cobre"
        body: "Desde que pague na PCMarket e comunique o problema dentro do prazo, cobrimos as situações que importam."
        items:
          - "Encomendas não recebidas ou gravemente danificadas."
          - "Artigos que não correspondem à descrição."
          - "Falsificações e defeitos não divulgados."
          - "Problemas abertos dentro do prazo de inspeção."
      review:
        title: "Todos os anúncios passam por revisão humana"
        body: "A pré-moderação permite detetar fraudes, artigos proibidos e descrições enganosas antes de chegarem aos compradores."
        items:
          - "Verificamos fotografias, preço e categoria."
          - "Procuramos sinais de risco e artigos proibidos."
          - "Rejeitamos anúncios incompletos ou suspeitos."
          - "As alterações importantes voltam a revisão."
        footnote: "A revisão reduz o risco mas não substitui o seu bom senso: se parecer bom demais, pergunte antes de pagar."
      verified:
        title: "O que significa vendedor verificado"
        body: "As lojas verificadas forneceram dados de identidade e contacto confirmados pela nossa equipa. O selo não é uma garantia absoluta, mas acrescenta confiança."
        company_title: "Vendedores profissionais"
        company_body: "Os vendedores profissionais mostram denominação e dados fiscais, prestam informação pré-contratual e assumem as garantias legais."
      tips:
        title: "Cinco hábitos para comprar com tranquilidade"
        items:
          - "Pague sempre na PCMarket, nunca por app, transferência direta ou ligações externas."
          - "Desconfie de preços muito baixos e da pressa para fechar."
          - "Veja a avaliação, as opiniões e a antiguidade do vendedor."
          - "Use o chat da plataforma e não partilhe dados bancários nem códigos."
          - "Inspecione o produto à chegada e abra uma disputa se necessário."
        report: "Aprender a detetar fraudes"
      contact:
        title: "Fale com uma equipa real"
        body: "Por trás da PCMarket estão pessoas que compram e vendem tecnologia. Se algo não bate certo, estamos aqui."
        help_title: "Centro de ajuda"
        help_body: "Guias passo a passo sobre compras, envios, pagamentos e segurança."
        help_cta: "Ver guias"
        email_title: "Email"
        email_body: "Escreva-nos e responderemos o mais breve possível."
        phone_title: "Telefone"
        phone_body: "Apoio em horário laboral."
        hours_title: "Horário"
        hours_body: "Segunda a sexta, hora da Europa Central."
      faq:
        title: "Perguntas frequentes"
        body: "O que mais nos perguntam sobre segurança, pagamentos e proteção."
        items:
          - q: "O que cobre exatamente a proteção do comprador?"
            a: "Encomendas pagas na PCMarket que não chegam, chegam danificadas ou não correspondem ao anúncio. Abra a disputa dentro do prazo de inspeção com provas."
          - q: "Quando recebe o vendedor?"
            a: "Quando confirma a receção ou termina o prazo de inspeção. Com uma disputa aberta, o pagamento fica retido até à resolução."
          - q: "Todos os anúncios são revistos?"
            a: "Sim. Os anúncios podem passar por revisão manual antes da publicação. Alterações importantes voltam a revisão."
          - q: "O que significa vendedor verificado?"
            a: "Que confirmámos a identidade e os contactos da loja. Ainda assim, veja as avaliações e a descrição antes de comprar."
          - q: "Posso pagar em dinheiro na recolha?"
            a: "Apenas em encomendas com recolha local. O pagamento é confirmado na plataforma para ficar protegido e registado."
          - q: "Como abro uma disputa?"
            a: "Abra a encomenda, selecione «Abrir disputa», escolha o motivo, explique o sucedido e anexe fotografias."
          - q: "Que artigos são proibidos?"
            a: "Artigos roubados, falsificados ou recolhidos, dispositivos bloqueados, armas e produtos perigosos ou ilegais."
          - q: "Como contacto a equipa?"
            a: "Pelo centro de ajuda, email ou telefone em horário laboral. Para problemas numa encomenda, abra uma disputa."
      cta:
        title: "Compre tecnologia usada com tranquilidade"
        body: "Explore anúncios revistos, pague na plataforma e deixe a proteção do comprador fazer o resto."
        browse: "Explorar anúncios"
        sell: "Vender o meu equipamento"
    about:
      meta_description: "A PCMarket torna a compra e venda de tecnologia usada simples, segura e sustentável."
      eyebrow: "Sobre nós"
      title: "Sobre a PCMarket"
      hero_title: "A tecnologia merece uma segunda vida"
      hero_body: "A PCMarket é um mercado de tecnologia nova e usada nascido em Espanha. Queremos que comprar um portátil, uma consola ou uma placa gráfica seja tão simples e seguro como comprar novo, e muito melhor para o planeta."
      hero_primary_cta: "Ver anúncios"
      hero_secondary_cta: "Conhecer a proteção"
      mission:
        title: "A nossa missão"
        body: "Prolongar a vida da tecnologia e tornar o bom hardware acessível. Revemos anúncios, protegemos pagamentos e damos ferramentas a vendedores particulares e profissionais."
        stat1_label: "Mercado"
        stat1_value: "Espanha e Europa"
        stat2_label: "Foco"
        stat2_value: "Pessoas primeiro"
      why:
        title: "Porque é que o usado importa"
        body: "Cada dispositivo que continua em uso evita resíduos eletrónicos, poupa matérias-primas e reduz as emissões de fabrico."
        items:
          - title: "Menos resíduos eletrónicos"
            body: "Prolongar a vida de um portátil evita que seja reciclado cedo demais."
          - title: "Menos matérias-primas"
            body: "Reutilizar componentes reduz a extração e a produção de novo hardware."
          - title: "Preços mais justos"
            body: "O usado permite aceder a equipamento potente sem o preço de novo."
          - title: "Comunidade local"
            body: "Comprar perto reduz envios e apoia vendedores da sua zona."
      how:
        title: "Como funciona"
        body: "Um mercado, duas experiências simples: comprar e vender."
        buyers_title: "Para compradores"
        buyers_steps:
          - "Encontre o produto com filtros de categoria, estado e preço."
          - "Veja o anúncio e a avaliação do vendedor."
          - "Pague na PCMarket e aguarde a entrega."
          - "Inspecione e confirme, ou abra uma disputa."
        buyers_cta: "Começar a comprar"
        sellers_title: "Para vendedores"
        sellers_steps:
          - "Publique grátis com fotografias e uma descrição honesta."
          - "Receba ofertas ou venda pelo preço anunciado."
          - "Envie com seguimento ou combine recolha local."
          - "Receba quando o comprador confirmar a receção."
        sellers_cta: "Criar anúncio"
      values:
        title: "O que nos guia"
        items:
          - title: "Transparência"
            body: "Preços claros, regras visíveis e nenhum número inventado."
          - title: "Segurança real"
            body: "Revisão humana, pagamentos protegidos e uma equipa que responde."
          - title: "Sustentabilidade"
            body: "Cada venda prolonga a vida de um produto e evita resíduos."
          - title: "Proximidade"
            body: "Apoio na sua língua e conhecimento do mercado local."
      team:
        title: "A equipa"
        body: "Somos uma equipa pequena que compra, vende e repara tecnologia. Estas são as áreas por trás de cada encomenda."
        members:
          - initials: "OP"
            role: "Operações"
            body: "Coordena envios, problemas e a relação com vendedores."
          - initials: "TS"
            role: "Confiança e segurança"
            body: "Revê anúncios, investiga fraudes e melhora a proteção."
          - initials: "CS"
            role: "Apoio ao cliente"
            body: "Responde a compradores e vendedores na sua língua."
      contact:
        title: "Vamos falar"
        body: "Tem uma dúvida, ideia ou sugestão? Escreva-nos."
        help: "Ir ao centro de ajuda"
        email: "Escrever à equipa"
