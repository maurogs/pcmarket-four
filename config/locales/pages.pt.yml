      body: "O que os vendedores mais perguntam antes do primeiro anúncio."
      contact: "Ir ao centro de ajuda"
      items:
        - q: "Quanto custa publicar?"
          a: "Publicar é grátis e sem mensalidades. Durante o lançamento não cobramos comissão; quando ativa, aplica-se apenas à venda concluída."
        - q: "Quem define o preço?"
          a: "O vendedor. Pode alterá-lo quando quiser e aceitar ofertas abaixo do preço publicado."
        - q: "Como sei que o comprador vai pagar?"
          a: "O pagamento acontece dentro da PCMarket e fica retido até enviar e o comprador confirmar a receção."
        - q: "Quando recebo o dinheiro?"
          a: "A proteção ao comprador liberta o pagamento após a inspeção. Se houver problema, o apoio media antes de libertar."
        - q: "Tenho de enviar ou posso entregar em mão?"
          a: "Escolha envio com seguimento ou recolha local. Se oferecer ambos, o comprador decide no checkout."
        - q: "E se o anúncio for rejeitado?"
          a: "Explicamos o motivo; pode corrigir e reenviar. Nada fica online sem revisão."
