    trust:
      meta_description: "Verified sellers, manual listing review, protected payments and a real team. This is how PCMarket protects every purchase."
      eyebrow: "Trust and safety"
      title: "Trust and safety"
      hero_title: "Is PCMarket safe? Here's how we protect every purchase"
      hero_body: "We review listings before they go live, hold your payment until the item arrives and keep real people on the other side. No empty promises: these are the rules."
      hero_primary_cta: "Browse listings"
      hero_secondary_cta: "Visit the help centre"
      stats:
        title: "PCMarket in numbers"
        note: "We show real platform figures. If a number is still small, we say so instead of inventing one."
        completed_orders:
          label: "Completed orders"
          hint: "Purchases delivered and closed successfully."
          fallback: "Growing every week"
        verified_stores:
          label: "Verified stores"
          hint: "Sellers with checked identity and details."
          fallback: "Verification in progress"
        average_rating:
          label: "Average rating"
          hint: "Average across stores with published reviews."
          fallback: "Reviews on the way"
        reviewed_listings:
          label: "Listings reviewed"
          hint: "Listings checked manually by the team."
          fallback: "Daily review in progress"
      how:
        title: "How buyer protection works"
        body: "You pay PCMarket, not the seller directly. The money is released when you confirm receipt or the %{days}-day inspection window ends."
        step1_title: "Pay securely on PCMarket"
        step1_body: "The amount is held on the platform. We never send your money to the seller at the moment of purchase."
        step2_title: "The seller ships with tracking"
        step2_body: "You receive a tracking number and can follow the shipment from your order."
        step3_title: "You inspect before they are paid"
        step3_body: "You have %{days} days to test the product, confirm receipt or open a dispute."
      covered:
        eyebrow: "Covered"
        title: "What buyer protection covers"
        body: "As long as you pay inside PCMarket and report the issue within the window, we cover the problems that matter."
        items:
          - "Orders that do not arrive or arrive seriously damaged."
          - "Items that do not match the listing description."
          - "Counterfeits and defects the seller did not disclose."
          - "Issues opened within the inspection window."
      review:
        title: "Every listing goes through human review"
        body: "Pre-moderation lets us catch fraud, prohibited items and misleading descriptions before buyers see them."
        items:
          - "We check photos, price and category."
          - "We look for risk signals and prohibited items."
          - "We reject incomplete or suspicious listings."
          - "Important changes go back to review."
        footnote: "Review reduces risk, but it does not replace your judgement: if something looks too good, ask before paying."
      verified:
        title: "What a verified seller means"
        body: "Verified stores have provided identity and contact details that our team has checked. The badge is not an absolute guarantee, but it adds an extra layer of trust."
        company_title: "Professional sellers"
        company_body: "Professional sellers show their company name and tax ID, provide pre-contractual information and honour statutory consumer guarantees."
      tips:
        title: "Five habits for safer buying"
        items:
          - "Always pay inside PCMarket. Never by payment app, direct transfer or external links."
          - "Be wary of prices far below the market and pressure to close quickly."
          - "Check the seller's rating, reviews and account age."
          - "Use the platform chat and never share bank details or codes."
          - "Inspect the item on arrival and open a dispute if something is wrong."
        report: "Learn how to spot scams"
      contact:
        title: "Talk to a real team"
        body: "PCMarket is run by people who buy and sell technology. If something does not add up, we are here to help."
        help_title: "Help centre"
        help_body: "Step-by-step guides on buying, shipping, payments and safety."
        help_cta: "View guides"
        email_title: "Email"
        email_body: "Write to us and we will reply as soon as we can."
        phone_title: "Phone"
        phone_body: "Support during business hours."
        hours_title: "Hours"
        hours_body: "Monday to Friday, Central European Time."
      faq:
        title: "Frequently asked questions"
        body: "What people ask us most about safety, payments and protection."
        items:
          - q: "What exactly does buyer protection cover?"
            a: "It covers orders paid inside PCMarket that do not arrive, arrive damaged or do not match the listing. You must open the dispute within the inspection window and provide evidence."
          - q: "When does the seller get paid?"
            a: "When you confirm receipt or the inspection window ends. If a dispute is open, payment is held until it is resolved."
          - q: "Are all listings reviewed before publication?"
            a: "Yes. Listings may go through manual review before they become visible. Important changes such as the title, category or photos go back for review."
          - q: "What does a verified seller mean?"
            a: "That we have checked the store's identity and contact details. It is a trust signal, but you should still review ratings and the description before buying."
          - q: "Can I pay cash on pickup?"
            a: "Only for local pickup orders. Payment is confirmed on the platform so the transaction stays protected and recorded."
          - q: "How do I open a dispute?"
            a: "Open the order, select \"Open dispute\", choose a reason, explain what happened and attach photos. Our team reviews the conversation and evidence."
          - q: "Which items are prohibited?"
            a: "Stolen, counterfeit or recalled items, locked devices, weapons and dangerous or illegal products. The full list is in the legal documents."
          - q: "How do I contact the team?"
            a: "Through the help centre, by email or by phone during business hours. For order issues, the fastest route is to open a dispute from the order."
      cta:
        title: "Buy second-hand tech with peace of mind"
        body: "Browse reviewed listings, pay inside the platform and let buyer protection do the rest."
        browse: "Browse listings"
        sell: "Sell my gear"
    about:
      meta_description: "PCMarket exists to make buying and selling second-hand technology simple, safe and sustainable."
      eyebrow: "About us"
      title: "About PCMarket"
      hero_title: "Technology deserves a second life"
      hero_body: "PCMarket is a marketplace for new and second-hand technology built in Spain. We want buying a laptop, console or graphics card to be as simple and safe as buying new, and far better for the planet."
      hero_primary_cta: "View listings"
      hero_secondary_cta: "See our protection"
      mission:
        title: "Our mission"
        body: "To extend the life of technology and make good hardware accessible. We review listings, protect payments and give private and professional sellers the tools to make second-hand less of a lottery."
        stat1_label: "Market"
        stat1_value: "Spain and Europe"
        stat2_label: "Focus"
        stat2_value: "People first"
      why:
        title: "Why second-hand matters"
        body: "Every device that stays in use avoids electronic waste, saves raw materials and lowers manufacturing emissions. It also makes good technology more affordable."
        items:
          - title: "Less e-waste"
            body: "Extending the life of a laptop or console stops it reaching recycling before its time."
          - title: "Fewer raw materials"
            body: "Reusing components reduces the need to mine minerals and manufacture new hardware."
          - title: "Fairer prices"
            body: "Second-hand lets people access powerful equipment without paying the new price."
          - title: "Local community"
            body: "Buying nearby cuts shipping and supports sellers in your area."
      how:
        title: "How it works"
        body: "One marketplace, two simple experiences: buying and selling."
        buyers_title: "For buyers"
        buyers_steps:
          - "Find the product with category, condition and price filters."
          - "Check the listing and the seller's rating."
          - "Pay inside PCMarket and wait for delivery."
          - "Inspect and confirm, or open a dispute if something is wrong."
        buyers_cta: "Start buying"
        sellers_title: "For sellers"
        sellers_steps:
          - "List for free with photos and an honest description."
          - "Receive offers or sell at the listed price."
          - "Ship with tracking or agree local pickup."
          - "Get paid when the buyer confirms receipt."
        sellers_cta: "Create a listing"
      values:
        title: "What guides us"
        items:
          - title: "Transparency"
            body: "Clear prices, visible rules and no invented numbers."
          - title: "Real safety"
            body: "Human review, protected payments and a team that replies."
          - title: "Sustainability"
            body: "Every sale extends a product's life and avoids waste."
          - title: "Closeness"
            body: "Support in your language and knowledge of the local market."
      team:
        title: "The team"
        body: "We are a small team that buys, sells and repairs technology. These are the areas behind every order."
        members:
          - initials: "OP"
            role: "Operations"
            body: "Coordinates shipping, issues and seller relationships."
          - initials: "TS"
            role: "Trust and safety"
            body: "Reviews listings, investigates fraud and improves protection."
          - initials: "CS"
            role: "Customer support"
            body: "Replies to buyers and sellers in their language."
      contact:
        title: "Let's talk"
        body: "Got a question, an idea or feedback on how we can improve? Write to us."
        help: "Go to the help centre"
        email: "Email the team"
