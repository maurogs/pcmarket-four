      body: "Guide pratiche per fotografare, descrivere e vendere meglio."
      view_all: "Vedi tutte le guide"
    sold:
      title: "Venduti di recente"
      body: "Hardware che questa settimana ha trovato un nuovo proprietario."
    faq:
      title: "Domande frequenti"
      body: "Quello che i venditori ci chiedono prima del primo annuncio."
      contact: "Vai al centro assistenza"
      items:
        - q: "Quanto costa pubblicare?"
          a: "Pubblicare è gratis e senza costi mensili. Al lancio non applichiamo commissioni; quando sarà attiva si applicherà solo alla vendita completata."
        - q: "Chi decide il prezzo?"
          a: "Tu. Puoi cambiarlo quando vuoi e accettare offerte sotto il prezzo pubblicato."
        - q: "Come so che l'acquirente pagherà?"
          a: "Il pagamento avviene dentro PCMarket e resta bloccato finché spedisci e l'acquirente conferma la ricezione."
        - q: "Quando ricevo il denaro?"
          a: "La protezione acquirente rilascia il pagamento dopo l'ispezione. In caso di problemi, il supporto media prima del rilascio."
        - q: "Devo spedire o posso consegnare a mano?"
          a: "Scegli spedizione tracciata o ritiro locale. Se offri entrambi, decide l'acquirente al checkout."
        - q: "E se il mio annuncio viene rifiutato?"
          a: "Spieghiamo il motivo; puoi correggerlo e inviarlo di nuovo. Nulla va online senza revisione."
    final:
      title: "Pronto a vendere?"
      body: "Pubblica oggi e raggiungi chi sta già cercando il tuo modello."
      cta: "Pubblica il tuo hardware"
      sell_to_us: "Vendici il tuo hardware"

