      toc_title: "Auf dieser Seite"
      cookie_cta_body: "Du kannst Analyse- und Marketing-Cookies jederzeit akzeptieren, ablehnen oder ändern."
    trust:
      meta_description: "Verifizierte Verkäufer, manuelle Anzeigenprüfung, geschützte Zahlungen und ein echtes Team. So schützt PCMarket jeden Kauf."
      eyebrow: "Vertrauen und Sicherheit"
      title: "Vertrauen und Sicherheit"
      hero_title: "Ist PCMarket sicher? So schützen wir jeden Kauf"
      hero_body: "Wir prüfen Anzeigen vor der Veröffentlichung, halten deine Zahlung bis zur Lieferung zurück und haben echte Menschen auf der anderen Seite. Keine leeren Versprechen: Das sind die Regeln."
      hero_primary_cta: "Anzeigen entdecken"
      hero_secondary_cta: "Zum Hilfe-Center"
      stats:
        title: "PCMarket in Zahlen"
        note: "Wir zeigen echte Plattformzahlen. Ist eine Zahl noch klein, sagen wir das, statt eine zu erfinden."
        completed_orders:
          label: "Abgeschlossene Bestellungen"
          hint: "Erfolgreich gelieferte und abgeschlossene Käufe."
          fallback: "Wächst jede Woche"
        verified_stores:
          label: "Verifizierte Shops"
          hint: "Verkäufer mit geprüfter Identität und Daten."
          fallback: "Verifizierung läuft"
        average_rating:
          label: "Durchschnittsbewertung"
          hint: "Durchschnitt der Shops mit veröffentlichten Bewertungen."
          fallback: "Bewertungen folgen"
        reviewed_listings:
          label: "Geprüfte Anzeigen"
          hint: "Vom Team manuell geprüfte Anzeigen."
          fallback: "Tägliche Prüfung läuft"
      how:
        title: "So funktioniert der Käuferschutz"
        body: "Du zahlst an PCMarket, nicht direkt an den Verkäufer. Das Geld wird freigegeben, wenn du den Erhalt bestätigst oder die Prüfungsfrist von %{days} Tagen endet."
        step1_title: "Sicher auf PCMarket zahlen"
        step1_body: "Der Betrag wird auf der Plattform gehalten. Wir senden dein Geld nie im Moment des Kaufs an den Verkäufer."
        step2_title: "Der Verkäufer versendet mit Tracking"
        step2_body: "Du erhältst eine Sendungsnummer und kannst den Versand in deiner Bestellung verfolgen."
        step3_title: "Du prüfst, bevor ausgezahlt wird"
        step3_body: "Du hast %{days} Tage, um das Produkt zu testen, den Erhalt zu bestätigen oder einen Fall zu eröffnen."
      covered:
        eyebrow: "Abgedeckt"
        title: "Was der Käuferschutz abdeckt"
        body: "Solange du auf PCMarket zahlst und das Problem innerhalb der Frist meldest, decken wir die wichtigen Fälle ab."
        items:
          - "Nicht angekommene oder stark beschädigte Bestellungen."
          - "Artikel, die nicht der Beschreibung entsprechen."
          - "Fälschungen und nicht offenbarte Mängel."
          - "Fälle, die innerhalb der Prüfungsfrist gemeldet werden."
      review:
        title: "Jede Anzeige wird von Menschen geprüft"
        body: "Die Vorabprüfung hilft uns, Betrug, verbotene Artikel und irreführende Beschreibungen zu erkennen, bevor Käufer sie sehen."
        items:
          - "Wir prüfen Fotos, Preis und Kategorie."
          - "Wir suchen nach Risikosignalen und verbotenen Artikeln."
          - "Wir lehnen unvollständige oder verdächtige Anzeigen ab."
          - "Wichtige Änderungen gehen erneut in die Prüfung."
        footnote: "Die Prüfung senkt das Risiko, ersetzt aber nicht deinen gesunden Menschenverstand: Ist etwas zu gut, frage vor dem Zahlen."
      verified:
        title: "Was ein verifizierter Verkäufer bedeutet"
        body: "Verifizierte Shops haben Identitäts- und Kontaktdaten angegeben, die unser Team geprüft hat. Das Abzeichen ist keine absolute Garantie, schafft aber zusätzliches Vertrauen."
        company_title: "Gewerbliche Verkäufer"
        company_body: "Gewerbliche Verkäufer zeigen Firma und Steuernummer, geben vorvertragliche Informationen und übernehmen gesetzliche Verbrauchergarantien."
      tips:
        title: "Fünf Gewohnheiten für sichereres Kaufen"
        items:
          - "Zahle immer auf PCMarket, nie per Zahlungs-App, Direktüberweisung oder externem Link."
          - "Sei vorsichtig bei Preisen weit unter Marktwert und bei Zeitdruck."
          - "Prüfe Bewertung, Rezensionen und Alter des Verkäufers."
          - "Nutze den Plattform-Chat und teile keine Bankdaten oder Codes."
          - "Prüfe den Artikel nach Erhalt und eröffne bei Problemen einen Fall."
        report: "Betrug erkennen lernen"
      contact:
        title: "Sprich mit einem echten Team"
        body: "Hinter PCMarket stehen Menschen, die Technik kaufen und verkaufen. Wenn etwas nicht stimmt, helfen wir."
        help_title: "Hilfe-Center"
        help_body: "Schritt-für-Schritt-Anleitungen zu Kauf, Versand, Zahlung und Sicherheit."
        help_cta: "Anleitungen ansehen"
        email_title: "E-Mail"
        email_body: "Schreib uns, wir antworten so schnell wie möglich."
        phone_title: "Telefon"
        phone_body: "Support zu Geschäftszeiten."
        hours_title: "Öffnungszeiten"
        hours_body: "Montag bis Freitag, mitteleuropäische Zeit."
      faq:
        title: "Häufige Fragen"
        body: "Was uns am häufigsten zu Sicherheit, Zahlungen und Schutz gefragt wird."
        items:
          - q: "Was deckt der Käuferschutz genau ab?"
            a: "Bestellungen, die auf PCMarket bezahlt wurden und nicht ankommen, beschädigt ankommen oder nicht der Anzeige entsprechen. Eröffne den Fall innerhalb der Prüfungsfrist mit Nachweisen."
          - q: "Wann wird der Verkäufer bezahlt?"
            a: "Wenn du den Erhalt bestätigst oder die Prüfungsfrist endet. Bei einem offenen Fall wird die Zahlung bis zur Lösung zurückgehalten."
          - q: "Werden alle Anzeigen geprüft?"
            a: "Ja. Anzeigen können vor der Veröffentlichung manuell geprüft werden. Wichtige Änderungen werden erneut geprüft."
          - q: "Was bedeutet ein verifizierter Verkäufer?"
            a: "Dass wir Identität und Kontaktdaten des Shops geprüft haben. Prüfe trotzdem Bewertungen und Beschreibung."
          - q: "Kann ich bei Abholung bar zahlen?"
            a: "Nur bei lokaler Abholung. Die Zahlung wird auf der Plattform bestätigt, damit sie geschützt und dokumentiert bleibt."
          - q: "Wie eröffne ich einen Fall?"
            a: "Öffne die Bestellung, wähle „Fall eröffnen“, nenne einen Grund, beschreibe das Problem und füge Fotos bei."
          - q: "Welche Artikel sind verboten?"
            a: "Gestohlene, gefälschte oder zurückgerufene Artikel, gesperrte Geräte, Waffen sowie gefährliche oder illegale Produkte."
          - q: "Wie erreiche ich das Team?"
            a: "Über das Hilfe-Center, per E-Mail oder telefonisch zu Geschäftszeiten. Bei Bestellproblemen ist ein Fall am schnellsten."
      cta:
        title: "Gebrauchte Technik mit gutem Gefühl kaufen"
        body: "Entdecke geprüfte Anzeigen, zahle auf der Plattform und lass den Käuferschutz den Rest erledigen."
        browse: "Anzeigen entdecken"
        sell: "Meine Technik verkaufen"
    about:
      meta_description: "PCMarket macht Kauf und Verkauf gebrauchter Technik einfach, sicher und nachhaltig."
      eyebrow: "Über uns"
      title: "Über PCMarket"
      hero_title: "Technik verdient ein zweites Leben"
      hero_body: "PCMarket ist ein Marktplatz für neue und gebrauchte Technik aus Spanien. Wir wollen Laptop, Konsole oder Grafikkarte so einfach und sicher kaufen wie neu – und viel besser für den Planeten."
      hero_primary_cta: "Anzeigen ansehen"
      hero_secondary_cta: "Unseren Schutz entdecken"
      mission:
        title: "Unsere Mission"
        body: "Die Lebensdauer von Technik verlängern und gutes Hardware zugänglich machen. Wir prüfen Anzeigen, schützen Zahlungen und geben privaten und gewerblichen Verkäufern Werkzeuge für verlässlichere Gebrauchtkäufe."
        stat1_label: "Markt"
        stat1_value: "Spanien und Europa"
        stat2_label: "Fokus"
        stat2_value: "Menschen zuerst"
      why:
        title: "Warum Gebrauchtes zählt"
        body: "Jedes Gerät, das weiter genutzt wird, vermeidet Elektroschrott, spart Rohstoffe und senkt Herstellungsemissionen."
        items:
          - title: "Weniger Elektroschrott"
            body: "Ein längeres Leben von Laptop oder Konsole verhindert frühes Recycling."
          - title: "Weniger Rohstoffe"
            body: "Wiederverwendung von Komponenten reduziert Bergbau und Neuproduktion."
          - title: "Fairere Preise"
            body: "Gebraucht ermöglicht starke Hardware ohne Neupreis."
          - title: "Lokale Community"
            body: "Kaufen in der Nähe spart Versand und unterstützt Verkäufer vor Ort."
      how:
        title: "So funktioniert es"
        body: "Ein Marktplatz, zwei einfache Wege: kaufen und verkaufen."
        buyers_title: "Für Käufer"
        buyers_steps:
          - "Finde das Produkt mit Filtern für Kategorie, Zustand und Preis."
          - "Prüfe Anzeige und Bewertung des Verkäufers."
          - "Zahle auf PCMarket und warte auf die Lieferung."
          - "Prüfe und bestätige oder eröffne einen Fall."
        buyers_cta: "Jetzt kaufen"
        sellers_title: "Für Verkäufer"
        sellers_steps:
          - "Kostenlos einstellen mit Fotos und ehrlicher Beschreibung."
          - "Angebote erhalten oder zum Festpreis verkaufen."
          - "Mit Tracking versenden oder Abholung vereinbaren."
          - "Bezahlt werden, wenn der Käufer den Erhalt bestätigt."
        sellers_cta: "Anzeige erstellen"
      values:
        title: "Was uns leitet"
        items:
          - title: "Transparenz"
            body: "Klare Preise, sichtbare Regeln und keine erfundenen Zahlen."
          - title: "Echte Sicherheit"
            body: "Menschliche Prüfung, geschützte Zahlungen und ein Team, das antwortet."
          - title: "Nachhaltigkeit"
            body: "Jeder Verkauf verlängert ein Produktleben und vermeidet Abfall."
          - title: "Nähe"
            body: "Support in deiner Sprache und Wissen über den lokalen Markt."
      team:
        title: "Das Team"
        body: "Wir sind ein kleines Team, das Technik kauft, verkauft und repariert. Diese Bereiche stehen hinter jeder Bestellung."
        members:
          - initials: "OP"
            role: "Betrieb"
            body: "Koordiniert Versand, Probleme und Verkäuferbeziehungen."
          - initials: "TS"
            role: "Vertrauen und Sicherheit"
            body: "Prüft Anzeigen, untersucht Betrug und verbessert den Schutz."
          - initials: "CS"
            role: "Kundensupport"
            body: "Antwortet Käufern und Verkäufern in ihrer Sprache."
      contact:
        title: "Sprechen wir"
        body: "Frage, Idee oder Feedback? Schreib uns."
        help: "Zum Hilfe-Center"
        email: "Team anschreiben"
