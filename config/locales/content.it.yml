it:
  content:
    legal_page:
      breadcrumb: "Informazioni legali"
      sidebar_title: "Documenti legali · %{country}"
      market_note: "Stai consultando i documenti legali del mercato %{country}."
      last_updated: "Ultimo aggiornamento: %{date}"
      version: "Versione %{version}"
      print: "Stampa"
      toc_title: "In questa pagina"
      cookie_cta_body: "Puoi accettare, rifiutare o modificare i cookie analitici e di marketing in qualsiasi momento."
    trust:
      meta_description: "Venditori verificati, revisione manuale degli annunci, pagamenti protetti e un team reale. Ecco come PCMarket protegge ogni acquisto."
      eyebrow: "Fiducia e sicurezza"
      title: "Fiducia e sicurezza"
      hero_title: "PCMarket è sicuro? Ecco come proteggiamo ogni acquisto"
      hero_body: "Controlliamo gli annunci prima della pubblicazione, tratteniamo il pagamento fino alla consegna e abbiamo persone reali dall'altra parte. Nessuna promessa vuota: queste sono le regole."
      hero_primary_cta: "Sfoglia gli annunci"
      hero_secondary_cta: "Visita il centro assistenza"
      stats:
        title: "PCMarket in numeri"
        note: "Mostriamo dati reali della piattaforma. Se un numero è ancora piccolo, lo diciamo invece di inventarlo."
        completed_orders:
          label: "Ordini completati"
          hint: "Acquisti consegnati e chiusi correttamente."
          fallback: "In crescita ogni settimana"
        verified_stores:
          label: "Negozi verificati"
          hint: "Venditori con identità e dati controllati."
          fallback: "Verifica in corso"
        average_rating:
          label: "Valutazione media"
          hint: "Media dei negozi con recensioni pubblicate."
          fallback: "Recensioni in arrivo"
        reviewed_listings:
          label: "Annunci revisionati"
          hint: "Annunci controllati manualmente dal team."
          fallback: "Revisione giornaliera in corso"
      how:
        title: "Come funziona la protezione acquirenti"
        body: "Paghi PCMarket, non direttamente il venditore. Il denaro viene rilasciato quando confermi la ricezione o termina il periodo di ispezione di %{days} giorni."
        step1_title: "Paga in sicurezza su PCMarket"
        step1_body: "L'importo resta sulla piattaforma. Non inviamo mai il tuo denaro al venditore al momento dell'acquisto."
        step2_title: "Il venditore spedisce con tracciamento"
        step2_body: "Ricevi un numero di tracciamento e puoi seguire la spedizione dall'ordine."
        step3_title: "Ispezioni prima del pagamento"
        step3_body: "Hai %{days} giorni per provare il prodotto, confermare la ricezione o aprire una controversia."
      covered:
        eyebrow: "Coperto"
        title: "Cosa copre la protezione acquirenti"
        body: "Se paghi su PCMarket e segnali il problema entro il termine, copriamo i casi che contano davvero."
        items:
          - "Ordini non ricevuti o gravemente danneggiati."
          - "Articoli non conformi alla descrizione."
          - "Contraffazioni e difetti non dichiarati."
          - "Problemi aperti entro il periodo di ispezione."
      review:
        title: "Ogni annuncio passa da una revisione umana"
        body: "La premoderazione ci permette di intercettare frodi, articoli vietati e descrizioni ingannevoli prima che arrivino agli acquirenti."
        items:
          - "Controlliamo foto, prezzo e categoria."
          - "Cerchiamo segnali di rischio e articoli vietati."
          - "Rifiutiamo annunci incompleti o sospetti."
          - "Le modifiche importanti tornano in revisione."
        footnote: "La revisione riduce il rischio ma non sostituisce il tuo buon senso: se sembra troppo bello, chiedi prima di pagare."
      verified:
        title: "Cosa significa venditore verificato"
        body: "I negozi verificati hanno fornito dati di identità e contatto controllati dal nostro team. Il badge non è una garanzia assoluta, ma aggiunge fiducia."
        company_title: "Venditori professionali"
        company_body: "I venditori professionali mostrano denominazione e dati fiscali, forniscono l'informativa precontrattuale e assumono le garanzie legali."
      tips:
        title: "Cinque abitudini per acquistare serenamente"
        items:
          - "Paga sempre su PCMarket, mai tramite app, bonifico diretto o link esterni."
          - "Diffida dei prezzi molto bassi e della fretta di chiudere."
          - "Controlla valutazione, recensioni e anzianità del venditore."
          - "Usa la chat della piattaforma e non condividere dati bancari o codici."
          - "Ispeziona il prodotto alla consegna e apri una controversia se necessario."
        report: "Impara a riconoscere le truffe"
      contact:
        title: "Parla con un team reale"
        body: "Dietro PCMarket ci sono persone che comprano e vendono tecnologia. Se qualcosa non torna, siamo qui."
        help_title: "Centro assistenza"
        help_body: "Guide passo passo su acquisti, spedizioni, pagamenti e sicurezza."
        help_cta: "Vedi le guide"
        email_title: "Email"
        email_body: "Scrivici e risponderemo il prima possibile."
        phone_title: "Telefono"
        phone_body: "Assistenza negli orari lavorativi."
        hours_title: "Orari"
        hours_body: "Dal lunedì al venerdì, ora dell'Europa centrale."
      faq:
        title: "Domande frequenti"
        body: "Le domande più comuni su sicurezza, pagamenti e protezione."
        items:
          - q: "Cosa copre esattamente la protezione acquirenti?"
            a: "Gli ordini pagati su PCMarket che non arrivano, arrivano danneggiati o non corrispondono all'annuncio. Apri la controversia entro il periodo di ispezione con le prove."
          - q: "Quando viene pagato il venditore?"
            a: "Quando confermi la ricezione o termina il periodo di ispezione. In caso di controversia il pagamento resta bloccato fino alla soluzione."
          - q: "Tutti gli annunci vengono controllati?"
            a: "Sì. Gli annunci possono passare da una revisione manuale prima della pubblicazione. Le modifiche importanti tornano in revisione."
          - q: "Cosa significa venditore verificato?"
            a: "Che abbiamo controllato identità e contatti del negozio. Controlla comunque valutazioni e descrizione prima di acquistare."
          - q: "Posso pagare in contanti al ritiro?"
            a: "Solo per ordini con ritiro locale. Il pagamento viene confermato sulla piattaforma per restare protetto e registrato."
          - q: "Come apro una controversia?"
            a: "Apri l'ordine, seleziona «Apri controversia», scegli un motivo, spiega l'accaduto e allega foto."
          - q: "Quali articoli sono vietati?"
            a: "Articoli rubati, contraffatti o richiamati, dispositivi bloccati, armi e prodotti pericolosi o illegali."
          - q: "Come contatto il team?"
            a: "Dal centro assistenza, via email o telefono negli orari lavorativi. Per problemi su un ordine, apri una controversia."
      cta:
        title: "Compra tecnologia usata con tranquillità"
        body: "Sfoglia annunci revisionati, paga sulla piattaforma e lascia fare il resto alla protezione acquirenti."
        browse: "Sfoglia gli annunci"
        sell: "Vendi il mio materiale"
    about:
      meta_description: "PCMarket rende semplice, sicuro e sostenibile comprare e vendere tecnologia usata."
      eyebrow: "Chi siamo"
      title: "Chi è PCMarket"
      hero_title: "La tecnologia merita una seconda vita"
      hero_body: "PCMarket è un marketplace di tecnologia nuova e usata nato in Spagna. Vogliamo che comprare un portatile, una console o una scheda grafica sia semplice e sicuro come comprarlo nuovo, e molto meglio per il pianeta."
      hero_primary_cta: "Vedi gli annunci"
      hero_secondary_cta: "Scopri la protezione"
      mission:
        title: "La nostra missione"
        body: "Allungare la vita della tecnologia e rendere accessibile l'hardware di qualità. Controlliamo gli annunci, proteggiamo i pagamenti e diamo strumenti a venditori privati e professionali."
        stat1_label: "Mercato"
        stat1_value: "Spagna ed Europa"
        stat2_label: "Focus"
        stat2_value: "Prima le persone"
      why:
        title: "Perché l'usato conta"
        body: "Ogni dispositivo che resta in uso evita rifiuti elettronici, risparmia materie prime e riduce le emissioni di produzione."
        items:
          - title: "Meno rifiuti elettronici"
            body: "Allungare la vita di un portatile evita un riciclo prematuro."
          - title: "Meno materie prime"
            body: "Riutilizzare componenti riduce estrazione e nuova produzione."
          - title: "Prezzi più giusti"
            body: "L'usato permette di accedere a hardware potente senza prezzo da nuovo."
          - title: "Comunità locale"
            body: "Comprare vicino riduce le spedizioni e sostiene i venditori locali."
      how:
        title: "Come funziona"
        body: "Un marketplace, due esperienze semplici: comprare e vendere."
        buyers_title: "Per gli acquirenti"
        buyers_steps:
          - "Trova il prodotto con filtri per categoria, stato e prezzo."
          - "Controlla l'annuncio e la valutazione del venditore."
          - "Paga su PCMarket e attendi la consegna."
          - "Ispeziona e conferma, oppure apri una controversia."
        buyers_cta: "Inizia ad acquistare"
        sellers_title: "Per i venditori"
        sellers_steps:
          - "Pubblica gratis con foto e una descrizione onesta."
          - "Ricevi offerte o vendi al prezzo indicato."
          - "Spedisci con tracciamento o concordi il ritiro."
          - "Ricevi il pagamento quando l'acquirente conferma."
        sellers_cta: "Crea un annuncio"
      values:
        title: "Cosa ci guida"
        items:
          - title: "Trasparenza"
            body: "Prezzi chiari, regole visibili e nessun numero inventato."
          - title: "Sicurezza reale"
            body: "Revisione umana, pagamenti protetti e un team che risponde."
          - title: "Sostenibilità"
            body: "Ogni vendita allunga la vita di un prodotto ed evita rifiuti."
          - title: "Vicinanza"
            body: "Supporto nella tua lingua e conoscenza del mercato locale."
      team:
        title: "Il team"
        body: "Siamo un piccolo team che compra, vende e ripara tecnologia. Queste sono le aree dietro ogni ordine."
        members:
          - initials: "OP"
            role: "Operazioni"
            body: "Coordina spedizioni, problemi e rapporti con i venditori."
          - initials: "TS"
            role: "Fiducia e sicurezza"
            body: "Controlla annunci, indaga frodi e migliora la protezione."
          - initials: "CS"
            role: "Assistenza clienti"
            body: "Risponde ad acquirenti e venditori nella loro lingua."
      contact:
        title: "Parliamone"
        body: "Una domanda, un'idea o un suggerimento? Scrivici."
        help: "Vai al centro assistenza"
        email: "Scrivi al team"
    help:
