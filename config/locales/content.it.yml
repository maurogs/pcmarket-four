        contact_body: "Scrivici o chiamaci. Rispondiamo negli orari lavorativi in italiano, inglese e spagnolo."
        contact_email: "Email"
        contact_phone: "Telefono"
        contact_hours: "Orari"
        contact_cta: "Conosci il team"
