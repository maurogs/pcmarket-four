        contact_title: "Serve altro aiuto?"
        contact_body: "Se questa guida non risolve, contatta il nostro team."
      feedback:
        title: "Ti è stato utile?"
        yes: "Sì, mi ha aiutato"
        no: "No, serve più aiuto"
        thanks: "Grazie per il tuo parere."
        recorded_yes: "Grazie. Siamo felici che sia stato utile."
        recorded_no: "Grazie. Rivedremo questa guida per migliorarla."
