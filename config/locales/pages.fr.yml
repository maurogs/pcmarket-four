      title: "Académie des vendeurs"
      body: "Des guides pratiques pour mieux photographier, décrire et vendre."
      view_all: "Voir tous les guides"
    sold:
      title: "Vendus récemment"
      body: "Du matériel qui a trouvé un nouveau propriétaire cette semaine."
    faq:
      title: "Questions fréquentes"
      body: "Ce que les vendeurs nous demandent le plus avant leur première annonce."
      contact: "Consulter le centre d'aide"
      items:
        - q: "Combien coûte la publication ?"
          a: "La publication est gratuite et sans abonnement. Au lancement, aucune commission n'est prélevée ; une fois activée, elle ne s'applique qu'à la vente."
        - q: "Qui fixe le prix ?"
          a: "Vous. Vous pouvez le modifier à tout moment et accepter des offres inférieures au prix affiché."
        - q: "Comment savoir si l'acheteur paiera ?"
          a: "Le paiement se fait dans PCMarket et reste bloqué jusqu'à l'expédition et la confirmation de réception."
        - q: "Quand suis-je payé ?"
          a: "La protection acheteur libère le paiement après inspection. En cas de problème, le support intervient avant le versement."
        - q: "Dois-je expédier ou puis-je remettre en main propre ?"
          a: "Choisissez l'envoi suivi ou le retrait local. Si vous proposez les deux, l'acheteur décide au paiement."
        - q: "Et si mon annonce est refusée ?"
          a: "Nous expliquons pourquoi ; vous pouvez corriger et soumettre à nouveau. Rien n'est publié sans vérification."
    final:
      title: "Prêt à vendre ?"
      body: "Publiez aujourd'hui et touchez des acheteurs qui cherchent déjà votre modèle."
      cta: "Publier mon matériel"
      sell_to_us: "Vendez-nous votre matériel"

