fr:
  content:
    legal_page:
      breadcrumb: "Informations légales"
      sidebar_title: "Documents légaux · %{country}"
      market_note: "Vous consultez les documents légaux du marché %{country}."
      last_updated: "Dernière mise à jour : %{date}"
      version: "Version %{version}"
      print: "Imprimer"
      toc_title: "Sur cette page"
      cookie_cta_body: "Vous pouvez accepter, refuser ou modifier les cookies analytiques et marketing à tout moment."
    trust:
      meta_description: "Vendeurs vérifiés, contrôle manuel des annonces, paiements protégés et une équipe réelle. Voici comment PCMarket protège chaque achat."
      eyebrow: "Confiance et sécurité"
      title: "Confiance et sécurité"
      hero_title: "PCMarket est-il sûr ? Voici comment nous protégeons chaque achat"
      hero_body: "Nous contrôlons les annonces avant publication, conservons votre paiement jusqu'à la réception et gardons de vraies personnes à l'autre bout. Pas de promesses vides : voici les règles."
      hero_primary_cta: "Parcourir les annonces"
      hero_secondary_cta: "Visiter le centre d'aide"
      stats:
        title: "PCMarket en chiffres"
        note: "Nous affichons de vrais chiffres. Si un chiffre est encore faible, nous le disons plutôt que d'en inventer un."
        completed_orders:
          label: "Commandes terminées"
          hint: "Achats livrés et clôturés avec succès."
          fallback: "En croissance chaque semaine"
        verified_stores:
          label: "Boutiques vérifiées"
          hint: "Vendeurs dont l'identité et les données sont vérifiées."
          fallback: "Vérification en cours"
        average_rating:
          label: "Note moyenne"
          hint: "Moyenne des boutiques ayant des avis publiés."
          fallback: "Avis à venir"
        reviewed_listings:
          label: "Annonces contrôlées"
          hint: "Annonces examinées manuellement par l'équipe."
          fallback: "Contrôle quotidien en cours"
      how:
        title: "Comment fonctionne la protection acheteur"
        body: "Vous payez PCMarket, pas directement le vendeur. L'argent est libéré à la confirmation de réception ou à la fin du délai d'inspection de %{days} jours."
        step1_title: "Payez en sécurité sur PCMarket"
        step1_body: "Le montant est retenu sur la plateforme. Nous ne versons jamais votre argent au vendeur au moment de l'achat."
        step2_title: "Le vendeur expédie avec suivi"
        step2_body: "Vous recevez un numéro de suivi et pouvez suivre l'envoi depuis votre commande."
        step3_title: "Vous inspectez avant le paiement"
        step3_body: "Vous avez %{days} jours pour tester le produit, confirmer la réception ou ouvrir un litige."
      covered:
        eyebrow: "Couvert"
        title: "Ce que couvre la protection acheteur"
        body: "Dès lors que vous payez sur PCMarket et signalez le problème dans le délai, nous couvrons les situations importantes."
        items:
          - "Commandes non reçues ou gravement endommagées."
          - "Articles ne correspondant pas à l'annonce."
          - "Contrefaçons et défauts non signalés."
          - "Incidents ouverts dans le délai d'inspection."
      review:
        title: "Chaque annonce passe par un contrôle humain"
        body: "La prémodération nous permet de détecter les fraudes, les articles interdits et les descriptions trompeuses avant les acheteurs."
        items:
          - "Nous vérifions les photos, le prix et la catégorie."
          - "Nous recherchons les signaux de risque et les articles interdits."
          - "Nous refusons les annonces incomplètes ou suspectes."
          - "Les modifications importantes repassent en contrôle."
        footnote: "Le contrôle réduit le risque mais ne remplace pas votre jugement : si c'est trop beau, posez des questions avant de payer."
      verified:
        title: "Que signifie un vendeur vérifié"
        body: "Les boutiques vérifiées ont fourni des données d'identité et de contact contrôlées par notre équipe. Le badge n'est pas une garantie absolue, mais ajoute une couche de confiance."
        company_title: "Vendeurs professionnels"
        company_body: "Les vendeurs professionnels affichent leur raison sociale et leur numéro fiscal, fournissent l'information précontractuelle et assument les garanties légales."
      tips:
        title: "Cinq habitudes pour acheter sereinement"
        items:
          - "Payez toujours sur PCMarket, jamais par application, virement direct ou lien externe."
          - "Méfiez-vous des prix très bas et de la pression pour conclure vite."
          - "Consultez la note, les avis et l'ancienneté du vendeur."
          - "Utilisez le chat de la plateforme et ne partagez jamais vos coordonnées bancaires."
          - "Inspectez le produit à réception et ouvrez un litige si nécessaire."
        report: "Apprendre à repérer les arnaques"
      contact:
        title: "Parlez à une vraie équipe"
        body: "PCMarket est animé par des personnes qui achètent et vendent du matériel. Si quelque chose cloche, nous sommes là."
        help_title: "Centre d'aide"
        help_body: "Guides pas à pas sur l'achat, l'envoi, le paiement et la sécurité."
        help_cta: "Voir les guides"
        email_title: "E-mail"
        email_body: "Écrivez-nous, nous répondrons dès que possible."
        phone_title: "Téléphone"
        phone_body: "Assistance pendant les heures ouvrées."
        hours_title: "Horaires"
        hours_body: "Du lundi au vendredi, heure d'Europe centrale."
      faq:
        title: "Questions fréquentes"
        body: "Ce que l'on nous demande le plus sur la sécurité, les paiements et la protection."
        items:
          - q: "Que couvre exactement la protection acheteur ?"
            a: "Les commandes payées sur PCMarket qui n'arrivent pas, arrivent endommagées ou ne correspondent pas à l'annonce. Ouvrez le litige dans le délai d'inspection avec des preuves."
          - q: "Quand le vendeur est-il payé ?"
            a: "À la confirmation de réception ou à la fin du délai d'inspection. En cas de litige, le paiement est retenu jusqu'à résolution."
          - q: "Toutes les annonces sont-elles contrôlées ?"
            a: "Oui. Elles peuvent passer par un contrôle manuel avant publication. Les changements importants repassent en contrôle."
          - q: "Que signifie un vendeur vérifié ?"
            a: "Que nous avons contrôlé l'identité et les coordonnées de la boutique. Vérifiez tout de même les avis et la description."
          - q: "Puis-je payer en main propre ?"
            a: "Uniquement pour le retrait local. Le paiement est confirmé sur la plateforme pour rester protégé et enregistré."
          - q: "Comment ouvrir un litige ?"
            a: "Ouvrez la commande, sélectionnez « Ouvrir un litige », choisissez un motif, expliquez et joignez des photos."
          - q: "Quels articles sont interdits ?"
            a: "Les produits volés, contrefaits ou rappelés, les appareils verrouillés, les armes et les produits dangereux ou illégaux."
          - q: "Comment contacter l'équipe ?"
            a: "Via le centre d'aide, par e-mail ou par téléphone. Pour une commande, ouvrez un litige depuis celle-ci."
      cta:
        title: "Achetez du matériel d'occasion sereinement"
        body: "Parcourez des annonces contrôlées, payez sur la plateforme et laissez la protection acheteur faire le reste."
        browse: "Parcourir les annonces"
        sell: "Vendre mon matériel"
    about:
      meta_description: "PCMarket rend l'achat et la vente de technologie d'occasion simples, sûrs et durables."
      eyebrow: "À propos"
      title: "À propos de PCMarket"
      hero_title: "La technologie mérite une seconde vie"
      hero_body: "PCMarket est une place de marché pour la technologie neuve et d'occasion, née en Espagne. Nous voulons acheter un ordinateur, une console ou une carte graphique aussi simplement et sûrement que du neuf, et bien mieux pour la planète."
      hero_primary_cta: "Voir les annonces"
      hero_secondary_cta: "Découvrir notre protection"
      mission:
        title: "Notre mission"
        body: "Prolonger la vie de la technologie et rendre le bon matériel accessible. Nous contrôlons les annonces, protégeons les paiements et donnons aux vendeurs particuliers et professionnels les outils pour rendre l'occasion plus fiable."
        stat1_label: "Marché"
        stat1_value: "Espagne et Europe"
        stat2_label: "Priorité"
        stat2_value: "Les personnes"
      why:
        title: "Pourquoi l'occasion compte"
        body: "Chaque appareil qui reste en usage évite des déchets électroniques, économise des matières premières et réduit les émissions de fabrication."
        items:
          - title: "Moins de déchets"
            body: "Prolonger la vie d'un ordinateur évite qu'il parte trop tôt au recyclage."
          - title: "Moins de matières premières"
            body: "Réutiliser des composants réduit l'extraction minière et la fabrication."
          - title: "Des prix plus justes"
            body: "L'occasion permet d'accéder à du bon matériel sans payer le prix du neuf."
          - title: "Communauté locale"
            body: "Acheter près de chez soi réduit les envois et soutient les vendeurs locaux."
      how:
        title: "Comment ça marche"
        body: "Une seule place de marché, deux expériences simples : acheter et vendre."
        buyers_title: "Pour les acheteurs"
        buyers_steps:
          - "Trouvez le produit avec les filtres catégorie, état et prix."
          - "Vérifiez l'annonce et la note du vendeur."
          - "Payez sur PCMarket et attendez la livraison."
          - "Inspectez et confirmez, ou ouvrez un litige."
        buyers_cta: "Commencer à acheter"
        sellers_title: "Pour les vendeurs"
        sellers_steps:
          - "Publiez gratuitement avec des photos et une description honnête."
          - "Recevez des offres ou vendez au prix affiché."
          - "Expédiez avec suivi ou convenez d'un retrait local."
          - "Soyez payé quand l'acheteur confirme la réception."
        sellers_cta: "Créer une annonce"
      values:
        title: "Ce qui nous guide"
        items:
          - title: "Transparence"
            body: "Des prix clairs, des règles visibles et aucun chiffre inventé."
          - title: "Sécurité réelle"
            body: "Contrôle humain, paiements protégés et une équipe qui répond."
          - title: "Durabilité"
            body: "Chaque vente prolonge la vie d'un produit et évite des déchets."
          - title: "Proximité"
            body: "Un support dans votre langue et une connaissance du marché local."
      team:
        title: "L'équipe"
        body: "Nous sommes une petite équipe qui achète, vend et répare du matériel. Voici les domaines derrière chaque commande."
        members:
          - initials: "OP"
            role: "Opérations"
            body: "Coordonne les envois, les incidents et les relations vendeurs."
          - initials: "TS"
            role: "Confiance et sécurité"
            body: "Contrôle les annonces, enquête sur les fraudes et améliore la protection."
          - initials: "CS"
            role: "Service client"
            body: "Répond aux acheteurs et vendeurs dans leur langue."
      contact:
        title: "Discutons"
        body: "Une question, une idée ou une suggestion ? Écrivez-nous."
        help: "Aller au centre d'aide"
        email: "Écrire à l'équipe"
