    trust:
      meta_description: "Vendedores verificados, revisión manual de anuncios, pagos protegidos y un equipo real. Así protege PCMarket cada compra."
      eyebrow: "Confianza y seguridad"
      title: "Confianza y seguridad"
      hero_title: "¿Es seguro PCMarket? Así protegemos cada compra"
      hero_body: "Revisamos los anuncios antes de publicarlos, retenemos el pago hasta que recibes el producto y tenemos un equipo de personas reales al otro lado. Sin promesas vacías: estas son las reglas."
      hero_primary_cta: "Explorar anuncios"
      hero_secondary_cta: "Visitar el centro de ayuda"
      stats:
        title: "PCMarket en cifras"
        note: "Mostramos cifras reales de la plataforma. Si un dato todavía es pequeño, lo decimos en lugar de inventar números."
        completed_orders:
          label: "Pedidos completados"
          hint: "Compras entregadas y cerradas correctamente."
          fallback: "Creciendo cada semana"
        verified_stores:
          label: "Tiendas verificadas"
          hint: "Vendedores con identidad y datos comprobados."
          fallback: "En proceso de verificación"
        average_rating:
          label: "Valoración media"
          hint: "Media de tiendas con reseñas publicadas."
          fallback: "Valoraciones en camino"
        reviewed_listings:
          label: "Anuncios revisados"
          hint: "Publicaciones revisadas manualmente por el equipo."
          fallback: "Revisión diaria en marcha"
      how:
        title: "Cómo funciona la protección al comprador"
        body: "Pagas a PCMarket, no directamente al vendedor. El dinero se libera cuando confirmas la recepción o termina el plazo de inspección de %{days} días."
        step1_title: "Pagas de forma segura en PCMarket"
        step1_body: "El importe queda retenido en la plataforma. Nunca enviamos tu dinero al vendedor en el momento de la compra."
        step2_title: "El vendedor envía con seguimiento"
        step2_body: "Recibes un número de seguimiento y puedes ver el estado del envío desde tu pedido."
        step3_title: "Inspeccionas antes de que cobren"
        step3_body: "Tienes %{days} días para probar el producto, confirmar la recepción o abrir una disputa."
      covered:
        eyebrow: "Cubierto"
        title: "Qué protege la protección al comprador"
        body: "Siempre que pagues dentro de PCMarket y abras la incidencia dentro del plazo, cubrimos los problemas que de verdad importan."
        items:
          - "Pedidos que no llegan o llegan gravemente dañados."
          - "Artículos que no coinciden con la descripción del anuncio."
          - "Falsificaciones y defectos no informados por el vendedor."
          - "Incidencias abiertas dentro del plazo de inspección."
      review:
        title: "Cada anuncio pasa por una revisión humana"
        body: "La premoderación nos permite detectar fraudes, artículos prohibidos y descripciones engañosas antes de que lleguen a los compradores."
        items:
          - "Comprobamos fotos, precio y categoría."
          - "Revisamos señales de riesgo y artículos prohibidos."
          - "Rechazamos anuncios incompletos o sospechosos."
          - "Los cambios importantes vuelven a revisión."
        footnote: "La revisión reduce el riesgo, pero no sustituye tu sentido común: si algo parece demasiado bueno, pregunta antes de pagar."
      verified:
        title: "Qué significa ser un vendedor verificado"
        body: "Las tiendas verificadas han aportado datos de identidad y contacto que nuestro equipo ha comprobado. La insignia no es una garantía absoluta, pero añade una capa extra de confianza."
        company_title: "Vendedores profesionales"
        company_body: "Los vendedores profesionales muestran su denominación social y NIF, ofrecen información precontractual y asumen las garantías legales de consumo."
      tips:
        title: "Cinco hábitos para comprar sin sustos"
        items:
          - "Paga siempre dentro de PCMarket. Nunca por Bizum, transferencia directa o enlaces externos."
          - "Desconfía de precios muy por debajo del mercado y de la prisa por cerrar."
          - "Revisa la valoración, las reseñas y la antigüedad del vendedor."
          - "Usa el chat de la plataforma y no compartas datos bancarios ni códigos."
          - "Inspecciona el producto al recibirlo y abre una disputa si algo falla."
        report: "Aprende a detectar estafas"
      contact:
        title: "Habla con un equipo real"
        body: "Detrás de PCMarket hay personas que compran y venden tecnología. Si algo no encaja, estamos para ayudarte."
        help_title: "Centro de ayuda"
        help_body: "Guías paso a paso sobre compras, envíos, pagos y seguridad."
        help_cta: "Ver guías"
        email_title: "Email"
        email_body: "Escríbenos y te responderemos lo antes posible."
        phone_title: "Teléfono"
        phone_body: "Atención en horario laboral."
        hours_title: "Horario"
        hours_body: "De lunes a viernes, hora peninsular."
      faq:
        title: "Preguntas frecuentes"
        body: "Lo que más nos preguntan sobre seguridad, pagos y protección."
        items:
          - q: "¿Qué cubre exactamente la protección al comprador?"
            a: "Cubre pedidos pagados dentro de PCMarket que no llegan, llegan dañados o no coinciden con el anuncio. Debes abrir la disputa dentro del plazo de inspección y aportar pruebas."
          - q: "¿Cuándo recibe el pago el vendedor?"
            a: "Cuando confirmas la recepción o termina el plazo de inspección. Si hay una disputa abierta, el pago queda retenido hasta resolverla."
          - q: "¿Todos los anuncios se revisan antes de publicarse?"
            a: "Sí. Los anuncios pueden pasar por una revisión manual antes de estar visibles. Los cambios importantes, como el título, la categoría o las fotos, vuelven a revisarse."
          - q: "¿Qué significa que un vendedor sea verificado?"
            a: "Que hemos comprobado datos de identidad y contacto de la tienda. Es una señal de confianza, aunque sigue revisando valoraciones y descripción antes de comprar."
          - q: "¿Puedo pagar en mano?"
            a: "Solo en pedidos con recogida local. El pago se confirma en la plataforma para que la operación quede protegida y registrada."
          - q: "¿Cómo abro una disputa?"
            a: "Abre el pedido, pulsa «Abrir disputa», elige el motivo, explica lo ocurrido y adjunta fotos. Nuestro equipo revisará la conversación y las pruebas."
          - q: "¿Qué artículos están prohibidos?"
            a: "Artículos robados, falsificados, retirados del mercado, dispositivos bloqueados, armas y productos peligrosos o ilegales. Puedes consultar la lista completa en los textos legales."
          - q: "¿Cómo contacto con el equipo?"
            a: "Desde el centro de ayuda, por email o por teléfono en horario laboral. Para incidencias de pedidos, lo más rápido es abrir una disputa desde el pedido."
      cta:
        title: "Compra tecnología usada con tranquilidad"
        body: "Explora anuncios revisados, compra dentro de la plataforma y deja que la protección al comprador haga el resto."
        browse: "Explorar anuncios"
        sell: "Vender mi equipo"
    about:
      meta_description: "PCMarket nace para que comprar y vender tecnología de segunda mano sea sencillo, seguro y sostenible."
      eyebrow: "Sobre nosotros"
      title: "Sobre PCMarket"
      hero_title: "Tecnología que merece una segunda vida"
      hero_body: "PCMarket es un mercado de tecnología nueva y de segunda mano construido desde España. Queremos que comprar un portátil, una consola o una gráfica usada sea tan sencillo y seguro como comprarlo nuevo, y mucho mejor para el planeta."
      hero_primary_cta: "Ver anuncios"
      hero_secondary_cta: "Conocer nuestra protección"
      mission:
        title: "Nuestra misión"
        body: "Alargar la vida de la tecnología y hacer accesible el buen hardware. Revisamos anuncios, protegemos pagos y damos herramientas a vendedores particulares y profesionales para que la segunda mano deje de ser una lotería."
        stat1_label: "Mercado"
        stat1_value: "España y Europa"
        stat2_label: "Enfoque"
        stat2_value: "Personas primero"
      why:
        title: "Por qué la segunda mano importa"
        body: "Cada dispositivo que sigue en uso evita residuos electrónicos, ahorra materias primas y reduce la huella de fabricación. También hace que la buena tecnología sea más asequible."
        items:
          - title: "Menos residuos electrónicos"
            body: "Prolongar la vida de un portátil o una consola evita que acabe en un punto limpio antes de tiempo."
          - title: "Menos materias primas"
            body: "Reutilizar componentes reduce la necesidad de extraer minerales y fabricar hardware nuevo."
          - title: "Precios más justos"
            body: "La segunda mano permite acceder a equipos potentes sin pagar el precio de estreno."
          - title: "Comunidad local"
            body: "Comprar cerca de casa reduce envíos y apoya a vendedores de tu zona."
      how:
        title: "Cómo funciona"
        body: "Un mismo mercado, dos experiencias sencillas: comprar y vender."
        buyers_title: "Para compradores"
        buyers_steps:
          - "Encuentra el producto con filtros por categoría, estado y precio."
          - "Revisa el anuncio y la valoración del vendedor."
          - "Paga dentro de PCMarket y espera el envío."
          - "Inspecciona y confirma, o abre una disputa si algo falla."
        buyers_cta: "Empezar a comprar"
        sellers_title: "Para vendedores"
        sellers_steps:
          - "Publica gratis con fotos y una descripción honesta."
          - "Recibe ofertas o vende al precio anunciado."
          - "Envía con seguimiento o acuerda recogida local."
          - "Cobra cuando el comprador confirma la recepción."
        sellers_cta: "Publicar un anuncio"
      values:
        title: "Lo que nos guía"
        items:
          - title: "Transparencia"
            body: "Precios claros, reglas visibles y ningún número inventado."
          - title: "Seguridad real"
            body: "Revisión humana, pagos protegidos y un equipo que responde."
          - title: "Sostenibilidad"
            body: "Cada venta alarga la vida de un producto y evita residuos."
          - title: "Cercanía"
            body: "Soporte en tu idioma y conocimiento del mercado local."
      team:
        title: "El equipo"
        body: "Somos un equipo pequeño que compra, vende y repara tecnología. Estas son las áreas que están detrás de cada pedido."
        members:
          - initials: "OP"
            role: "Operaciones"
            body: "Coordina envíos, incidencias y la relación con vendedores."
          - initials: "TS"
            role: "Confianza y seguridad"
            body: "Revisa anuncios, investiga fraudes y mejora la protección."
          - initials: "CS"
            role: "Atención al cliente"
            body: "Responde a compradores y vendedores en su idioma."
      contact:
        title: "Hablemos"
        body: "¿Tienes una duda, una idea o quieres contarnos cómo mejorar? Escríbenos."
        help: "Ir al centro de ayuda"
        email: "Escribir al equipo"
