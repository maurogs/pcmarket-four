  sell_page:
    meta:
      title: "Sell your gear on PCMarket"
      description: "List your item, talk to buyers and get paid with seller protection. No fees during launch."
    hero:
      eyebrow: "Sell with confidence"
      title: "Your gear deserves a second owner"
      body: "Add photos and specs, take offers or sell directly, and get paid when the buyer confirms delivery. We provide the tools and the protection."
      cta: "List your gear"
      secondary_cta: "See how it works"
      note: "Free during launch. Listing does not commit you to selling."
      preview_title: "What a sale looks like"
