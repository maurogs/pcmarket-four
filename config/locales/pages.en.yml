      title: "Three steps, no hassle"
      body: "You control the listing and the price. We take care of the rest."
      list_title: "List it"
      list_body: "Add photos, specifications and the real condition. Every listing is reviewed before going live."
      sell_title: "Sell it"
      sell_body: "Chat, accept offers or let the buyer check out directly."
      paid_title: "Get paid"
      paid_body: "Buyer protection releases payment after the item is inspected."
    perks:
      title: "Why sell here"
      commission_off: "No fees during launch: you keep 100% of the sale price."
      commission_on: "Low %{percent}% commission only when you sell. No monthly fees."
      fees_title: "Listing is free"
      fees_body: "No listing fee and no monthly charge. You only pay when you sell."
      fees_body_on: "%{percent}% commission only on a sale. No hidden costs."
      review_title: "Human review"
      review_body: "Every listing is reviewed so buyers trust what they see."
      payments_title: "Secure payments"
      payments_body: "The money is held until the buyer confirms receipt."
      community_title: "Local community"
      community_body: "Real buyers in your country and support in your language."
    stores:
      title: "Stores already selling here"
      body: "Verified professionals with a sales track record."
      view_all: "Browse stores"
      sales: "%{count} completed sales"
    academy:
      title: "Seller academy"
      body: "Practical guides to photograph, describe and sell better."
      view_all: "See all guides"
    sold:
      title: "Recently sold"
      body: "Gear that found a new owner this week."
    faq:
      title: "Frequently asked questions"
      body: "What sellers ask us most before publishing their first listing."
      contact: "Visit the help centre"
      items:
        - q: "How much does listing cost?"
          a: "Listing is free and there are no monthly fees. During launch we charge no commission; once it is enabled it only applies when a sale completes."
        - q: "Who sets the price?"
          a: "You do. You can change it at any time and accept offers below the listed price."
        - q: "How do I know the buyer will pay?"
          a: "Payment happens inside PCMarket and is held until you ship and the buyer confirms receipt."
        - q: "When do I get the money?"
          a: "Buyer protection releases payment after inspection. If something goes wrong, support mediates before releasing the funds."
        - q: "Do I have to ship, or can I hand it over?"
          a: "Choose tracked shipping or local pickup. If you offer both, the buyer decides at checkout."
        - q: "What if my listing is rejected?"
          a: "We explain why and you can fix it and resubmit. Nothing goes live without review."
    final:
      title: "Ready to sell?"
      body: "Publish today and reach buyers already looking for your model."
      cta: "List your gear"
      sell_to_us: "Sell to PCMarket"

