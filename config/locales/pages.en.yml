      inspect_body: "We check that it works and matches the declared condition."
      paid_title: "Get paid"
      paid_body: "Bank transfer to your IBAN within 2–3 working days after inspection."
    faq:
      title: "Frequently asked questions"
      body: "Everything to know before sending your component."
      items:
        - q: "Which components do you buy?"
          a: "Working desktop graphics cards and processors. The price table lists the accepted models."
        - q: "Is the offer final?"
          a: "The estimate is based on the declared condition. If inspection finds differences, we propose a revised price before rejecting it."
        - q: "Who pays for shipping?"
          a: "We do: you get a prepaid, insured label."
        - q: "How long does payment take?"
          a: "2–3 working days after inspection, by transfer to the IBAN you provide when accepting."
        - q: "Can I cancel?"
          a: "Yes. Until you ship the part you can decline the offer from your account."
